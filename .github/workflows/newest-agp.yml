name: Newest AGP

# Early warning for the next AGP: runs the AGP 9 integration tests, including the
# R8 input guard, on the newest AGP and Gradle (previews too), then again as AGP 10
# would behave.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  newest-agp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # AGP 10 requires JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # `~` sorts a preview (9.8.0~rc~1) before its release (9.8.0).
      - name: Find the newest AGP and Gradle
        id: newest
        run: |
          newest() { tr - '~' | sort -V | tail -1 | tr '~' -; }
          agp=$(curl -fsS https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | newest)
          gradle=$(curl -fsS https://services.gradle.org/versions/all \
            | jq -r '.[] | select(.snapshot or .nightly or .releaseNightly or .broken | not) | .version' | newest)
          echo "agp=$agp" >> "$GITHUB_OUTPUT"
          echo "gradle=$gradle" >> "$GITHUB_OUTPUT"

      - name: AGP ${{ steps.newest.outputs.agp }} on Gradle ${{ steps.newest.outputs.gradle }}
        run: >-
          ./gradlew :proguard-shield:gradleTest --tests '*ProGuardShieldPluginAgp9Test' --stacktrace
          -Pagp9Version=${{ steps.newest.outputs.agp }} -Pagp9GradleVersion=${{ steps.newest.outputs.gradle }}

      - name: The same, as AGP 10 would behave
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :proguard-shield:gradleTest --tests '*ProGuardShieldPluginAgp9Test' --stacktrace
          -Pagp9Version=${{ steps.newest.outputs.agp }} -Pagp9GradleVersion=${{ steps.newest.outputs.gradle }}
          -PsimulateAgpVersion=10.0.0
